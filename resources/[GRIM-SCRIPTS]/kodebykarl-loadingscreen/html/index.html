<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grim City — Loading</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="brand">
    <img src="assets/logo.png" alt="Grim City" class="brand-logo" draggable="false" />
  </header>

  <!-- Right-edge key + staff sidebar -->
  <button type="button" class="sidebar-key" id="sidebarKey" aria-label="Open staff" aria-expanded="false" title="Staff">
    <span class="sidebar-key__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a5 5 0 0 0-1 9.9V14H9v2h2v2h2v-4.1A5 5 0 0 0 12 2zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
    </span>
    <span class="sidebar-key__label">STAFF</span>
  </button>

  <aside class="staff-sidebar" id="staffSidebar" aria-hidden="true">
    <div class="staff-sidebar__header">
      <h2 class="staff-sidebar__title">City Staff</h2>
      <button type="button" class="staff-sidebar__close" id="sidebarClose" aria-label="Close">×</button>
    </div>
    <div class="staff-sidebar__body">
      <div class="staff-sidebar__list" id="staffList"></div>
      <p class="staff-empty" id="staffEmpty">No staff listed yet.</p>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <div class="load-meter">
    <div class="load-meter__bar">
      <div class="load-meter__fill" id="loadFill"></div>
    </div>
    <span class="load-meter__label" id="loadLabel">0%</span>
  </div>

  <footer class="player" id="player">
    <img src="assets/logo.png" alt="" class="player-logo" draggable="false" />
    <div class="player-meta">
      <span class="player-title" id="trackTitle">Loading Theme</span>
      <span class="player-artist" id="trackArtist">Grim City</span>
      <div class="player-progress">
        <div class="player-progress__fill" id="musicFill"></div>
      </div>
      <div class="player-times">
        <span id="musicTime">0:00</span>
        <span id="musicDuration">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button type="button" class="ctrl" id="btnPlay" aria-label="Play / Pause" title="Play / Pause">
        <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" class="is-hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button type="button" class="ctrl" id="btnStop" aria-label="Stop" title="Stop">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button type="button" class="ctrl ctrl--mute" id="btnMute" aria-label="Mute" title="Mute">
        <svg id="iconVol" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.74 2.5-2.26 2.5-4.02z"/></svg>
        <svg id="iconMute" class="is-hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v4h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
    </div>
  </footer>

  <div id="ytHost" class="yt-host" aria-hidden="true"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/app.js"></script>
</body>
</html>
