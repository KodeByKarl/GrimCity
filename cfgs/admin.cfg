# ACE PERMISSION GROUPS & COMMAND ACCESS
# Staff members are assigned with /setgroup (saved in user_groups).
# Do not list owner/admin/mod licenses here — ESX attaches ACE from the DB.
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.add_ace allow

add_ace group.developer command allow
add_ace group.developer command.quit deny

add_ace group.owner command allow
add_ace group.owner command.quit deny

add_ace group.superadmin command allow
add_ace group.superadmin command.quit deny
add_ace group.admin command allow
add_ace group.mod command allow

# Identity ACEs so IsPlayerAceAllowed(src, "group.owner") etc. work.
# Principals alone do NOT grant an ACE named like the group.
add_ace group.developer group.developer allow
add_ace group.owner group.owner allow
add_ace group.superadmin group.superadmin allow
add_ace group.admin group.admin allow
add_ace group.mod group.mod allow

# IMPORTANT: Never put command.* deny on group.admin / group.mod.
# Hierarchy is developer -> owner -> superadmin -> admin -> mod, so those
# denies are inherited by owner/superadmin and ACE deny always wins.
# Item spawn is blocked for admin/mod in ox_inventory Lua (group check).

# Clear denies that previously broke owner/superadmin command access.
remove_ace group.mod command.additem deny
remove_ace group.mod command.giveitem deny
remove_ace group.mod command.setitem deny
remove_ace group.mod command.giveweapon deny
remove_ace group.mod command.giveammo deny
remove_ace group.mod command.giveweaponcomponent deny
remove_ace group.admin command.additem deny
remove_ace group.admin command.giveitem deny
remove_ace group.admin command.setitem deny
remove_ace group.admin command.giveweapon deny
remove_ace group.admin command.giveammo deny
remove_ace group.admin command.giveweaponcomponent deny
remove_ace group.superadmin command.giveitem deny
remove_ace group.superadmin command.giveweapon deny
remove_ace group.superadmin command.giveammo deny
remove_ace group.superadmin command.giveweaponcomponent deny
remove_ace group.superadmin command.giveaccountmoney deny
remove_ace group.superadmin command.setaccountmoney deny
remove_ace group.superadmin command.removeaccountmoney deny
remove_ace group.superadmin command.setgroup deny
remove_ace group.superadmin command.clearinventory deny
remove_ace group.superadmin command.clearloadout deny

# GROUP HIERARCHY INHERITANCE
add_principal group.developer group.owner
add_principal group.owner group.superadmin
add_principal group.superadmin group.admin
add_principal group.admin group.mod

# =============================================================================
#   F I V E G U A R D   M O V E M E N T / V E H I C L E   B Y P A S S
#   Resource folder: grimbot (FiveGuard). Scripts resolve this via convar + fallbacks.
#   Players: ambulance deathcam / script teleports / mechanic / dealership use SetTempPermission.
#   Staff: ACE only. Do not give Client or Vehicle allow to normal players.
# =============================================================================
set fiveguard_resource grimbot
add_ace group.superadmin Client allow
add_ace group.superadmin AdminMenu allow
add_ace group.superadmin Misc allow
add_ace group.superadmin Vehicle allow

add_ace group.admin AdminMenu allow
add_ace group.admin BypassSpectate allow
add_ace group.admin BypassTeleport allow
add_ace group.admin BypassFreecam allow
add_ace group.admin BypassInvisible allow
add_ace group.admin BypassNoclip allow
add_ace group.admin BypassSuperJump allow
add_ace group.admin BypassSpeedHack allow

add_ace group.mod BypassSpectate allow

# DEVELOPER PRINCIPAL ASSIGNMENTS
add_principal identifier.license:0e5eb3a25fe1fb77788a2aeada703161bb0275ec group.developer

