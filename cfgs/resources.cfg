# ═══════════════════════════════════════
# GRIM Loading Screen (must start early for loadscreen handover)
# Hide busy spinner: setr sv_showBusySpinnerOnLoadingScreen false
# Discord staff: set kodebykarl_discord_bot_token + Config.Discord role IDs
# ═══════════════════════════════════════
ensure kodebykarl-loadingscreen

# ═══════════════════════════════════════
# GRIM Core & Framework ([GRIM-MAIN])
# Starts individual core resources in exact dependency order
# ═══════════════════════════════════════
ensure oxmysql
ensure ox_lib
ensure es_extended
# Universal Discord logs (bot token: kodebykarl_discord_bot_token)
ensure kodebykarl-logs
# Single character identity + spawn (replaces kodebykarl-multicharacter)
ensure kodebykarl-identity
ensure illenium-appearance

# ═══════════════════════════════════════
# GRIM Overextended Packs ([GRIM-OX])
# Includes: ox_target, ox_inventory, ox_doorlock
# ═══════════════════════════════════════
ensure ox_target
ensure [GRIM-OX]
ensure [GRIM-GARAGE]

# ═══════════════════════════════════════
# Voice (pma-voice + cfx-keydi-radio → kodebykarl-ui radiolist)
# ═══════════════════════════════════════
ensure [CFX-VOICE]

# ═══════════════════════════════════════
# GRIM Custom Modules & UI ([GRIM-SCRIPTS])
# Includes: kodebykarl-ui
# grimbot = FiveGuard (start before other scripts so SetTempPermission is ready)
# ═══════════════════════════════════════
ensure grimbot
ensure kodebykarl-utils
ensure [GRIM-SCRIPTS]
ensure [GRIM-HUD]
ensure [GRIM-ROBBERY]
ensure [GRIM-JOBS]
ensure [GRIM-MAPS]
ensure [GRIM-CARS]
ensure [GRIM-CLOTHES]
ensure [university]
ensure [GRIM-GANG]