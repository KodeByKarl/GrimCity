# ═══════════════════════════════════════
# MySQL
# ═══════════════════════════════════════
# MySQL Connection String Guide:
# https://overextended.dev/oxmysql
set mysql_connection_string "mysql://root:@localhost/grimrp?charset=utf8mb4" # Main Server
set mysql_ui true
svgui
set mysql_slow_query_warning 50000

# ═══════════════════════════════════════
# Network
# ═══════════════════════════════════════
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Discord bot token (shared by loadingscreen, scoreboard, namechecker, etc.)
set kodebykarl_discord_bot_token "MTUzNzM5NDA3MzQzNzA4NTc2OA.Gzbs_j.lsjBqH2Pw4RbZiazsZIfNd86W5Q2T1Zb0DroTE"
setr sv_showBusySpinnerOnLoadingScreen false

# Server Name
sv_hostname "Grim School Roleplay"

# Project Name (shown in server list — not truncated like sv_hostname)
sets sv_projectName "Grim School Roleplay"

# Project Description
sets sv_projectDesc "Developed and Maintained by KodeByKarl.Net"


# Server Name (Displayed in EasyAim Dashboard)
set easyaim_server_name "Grim School Roleplay"

# Unique Server Identifier (Lowercase, No Spaces)
set easyaim_server_id "grimschoolrp"

# ═══════════════════════════════════════
# Resources
# ═══════════════════════════════════════
# Uncomment the configs below to enable them.

# OneSync is required by pma-voice (infinity is the current FiveM default).
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync infinity
exec cfgs/onesync.cfg
exec cfgs/voice.cfg
exec cfgs/ox.cfg
exec cfgs/admin.cfg
# Electron AC ACE + child-process permission MUST load before the resource starts
exec cfgs/resources.cfg

# ═══════════════════════════════════════
# Server Mode
# ═══════════════════════════════════════
set sv_debugMode 0
set sv_dev 0

# Allows ScriptHook (Recommended: 0)
# https://docs.fivem.net/docs/server-manual/server-commands/
sv_scriptHookAllowed 0

# Remote Console Password
# https://docs.fivem.net/docs/server-manual/server-commands/#rcon_password-password
# rcon_password ""

# ═══════════════════════════════════════
# Server Info
# ═══════════════════════════════════════

# Server Tags
# https://docs.fivem.net/docs/server-manual/server-commands/#sets-key-value
sets tags "roleplay, rp"

# Server Locale
# https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-lcid/
sets locale "en-PH"

# Optional Banner URLs (Recommended: 1920x1080 PNG/JPG)
