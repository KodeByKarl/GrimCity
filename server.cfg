sets banner_connecting "https://r2.fivemanage.com/7qoUgFxV85h3Czm85xGbV/banner.png"

# Discord / Socials
sets "Server Discord" "https://discord.gg/2U2MuwTYTF"
sets "Developer Discord" "https://discord.gg/x9RAruCmP"

# 96x96 PNG Icon
# https://docs.fivem.net/docs/server-manual/server-commands/#load_server_icon-fileName
load_server_icon "image.png"

# Custom ConVar
set temp_convar ""

